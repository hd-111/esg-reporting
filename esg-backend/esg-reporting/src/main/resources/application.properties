spring.application.name=esg-reporting

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/esgreporting_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true


logging.level.org.springframework.security=DEBUG
logging.level.com.esg.esg_reporting=DEBUG